<section class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
  <div>
    <h1 class="text-3xl md:text-5xl font-retro text-neonYellow mb-6 animate-glowPulse">Retro Auctions</h1>
    <p class="text-neonCyan/80 mb-6">Bid, sell, and discover nostalgic treasures in a neon-tinged arcade interface.</p>
    <div class="flex gap-4">
      <a routerLink="/auctions" class="btn-neon" appNeonButton>Browse Auctions</a>
      <a routerLink="/sell" class="btn-neon" appNeonButton>Sell an Item</a>
    </div>
  </div>
  <div class="relative">
    <div class="absolute -inset-2 rounded-xl blur-lg" style="background: radial-gradient(circle at 50% 50%, rgba(0,255,247,0.35), rgba(255,43,214,0.2));"></div>
    <div class="relative rounded-xl border border-neonCyan/40 bg-ink/60 p-4" appTilt3d [tiltScale]="1.03">
      <div class="aspect-video rounded-md overflow-hidden">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=60" alt="retro" class="w-full h-full object-cover" />
      </div>
    </div>
  </div>
</section>
