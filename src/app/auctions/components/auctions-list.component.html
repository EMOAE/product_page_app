<section>
  <h1 class="text-3xl md:text-4xl font-retro text-neonYellow mb-6">Live Auctions</h1>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <article
      *ngFor="let item of items"
      class="rounded-lg border border-neonCyan/30 bg-ink/60 p-4 hover:border-neonMagenta/60 transition cursor-pointer"
      (click)="open(item)"
      appTilt3d
      [tiltScale]="1.02"
    >
      <div class="aspect-video mb-3 overflow-hidden rounded-md">
        <img [src]="item.imageUrl" [alt]="item.title" class="w-full h-full object-cover" />
      </div>
      <h2 class="text-xl text-neonCyan font-bold mb-1">{{ item.title }}</h2>
      <p class="text-sm text-neonCyan/80 mb-3">{{ item.location }}</p>
      <p class="text-sm text-crtGreen/90 line-clamp-3 mb-4">{{ item.description }}</p>
      <div class="flex items-center justify-between text-sm">
        <span>Current bid: <span class="text-neonYellow font-semibold">${{ item.currentBid }}</span></span>
        <button class="btn-neon" appNeonButton>Bid</button>
      </div>
    </article>
  </div>
</section>
